services:
  - type: web
    name: personal-canon-kit
    runtime: python
    region: singapore
    plan: free
    # rootDir 를 두지 않는다 — guides/(도움말 정본)가 같이 올라가야 한다. 파이썬 버전은 루트 .python-version.
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn --app-dir server main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTHKIT_ISSUER
        value: https://wealthy-technology-63-staging.authkit.app
      - key: CANON_PUBLIC_URL
        sync: false
      - key: AUTHKIT_WEB_CLIENT_ID
        value: client_01M56STKY61NSCEJCN6141YVEQ
      - key: CANON_SESSION_SECRET
        generateValue: true

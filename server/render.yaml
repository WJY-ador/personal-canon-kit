services:
  - type: web
    name: personal-mycrm
    runtime: python
    region: singapore
    plan: free
    # rootDir 를 두지 않는다 — guides/(도움말 정본)가 같이 올라가야 한다. 파이썬 버전은 루트 .python-version.
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn --app-dir server main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTHKIT_ISSUER
        value: https://wealthy-technology-63-staging.authkit.app
      - key: CRM_PUBLIC_URL
        sync: false
      - key: AUTHKIT_WEB_CLIENT_ID
        value: client_01M593TEKZ4P1CAJMEKXFE6JA8
      - key: CRM_SESSION_SECRET
        generateValue: true   # 새 서비스(personal-mycrm)를 만들 때 한 번 생성. 새 주소라 옛 쿠키는 어차피 안 따라온다
      - key: CRM_FEATURE_STANDARD
        sync: false   # on 만 켬, 미설정·그 밖 값 = off. 값은 Render 대시보드가 정본 — 배포가 덮지 않는다
      - key: CRM_FEATURE_SOURCES
        sync: false

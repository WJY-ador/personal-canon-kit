<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 노트</title>
<style>
/* 시작 화면 — app.html 과 같은 색 토큰·글꼴·종이. 한 열. */
:root {
  color-scheme: light;
  --bg: #FBF8F4; --paper: #FFFFFF; --ink: #2B2824; --muted: #6F685E; --meta: #9A9288; --line: #EFE8DF;
  --accent: #E4705A; --on-accent: #FFFFFF; --accent-soft: #FDEDE8;
  --cand-bg: #FBF9FF; --cand-line: #D9CFF5;
  --mine: #1A7F37; --mine-bg: #E5F6EA;
  --shadow: 0 6px 24px rgba(43, 40, 36, .05); --paper-border: 0 solid transparent;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #221F1B; --paper: #2C2925; --ink: #F3EEE6; --muted: #B9B0A4; --meta: #847C72; --line: #3F3A34;
    --accent: #F08E78; --on-accent: #221F1B; --accent-soft: #3B2A25;
    --cand-bg: #2E2B36; --cand-line: #4A4160;
    --mine: #3FB950; --mine-bg: #213223;
    --shadow: none; --paper-border: 1px solid var(--line);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #221F1B; --paper: #2C2925; --ink: #F3EEE6; --muted: #B9B0A4; --meta: #847C72; --line: #3F3A34;
  --accent: #F08E78; --on-accent: #221F1B; --accent-soft: #3B2A25;
  --cand-bg: #2E2B36; --cand-line: #4A4160;
  --mine: #3FB950; --mine-bg: #213223;
  --shadow: none; --paper-border: 1px solid var(--line);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); overflow-wrap: anywhere; word-break: keep-all;
  font: 17px/1.75 "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

.bands { padding-top: 28px; }
.band { padding: 12px 18px; border-radius: 14px; margin-bottom: 12px; font-size: 14px; background: var(--paper); border: var(--paper-border); }

.paper { background: var(--paper); border-radius: 22px; padding: 36px 40px; box-shadow: var(--shadow); border: var(--paper-border); margin: 28px 0 24px; }
.bands + .paper { margin-top: 4px; }
h1 { font-size: 30px; line-height: 1.3; margin: 0 0 8px; letter-spacing: -.02em; font-weight: 800; }
.lead { color: var(--muted); margin: 0 0 22px; }

.steps { list-style: none; padding: 0; margin: 0 0 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.steps li { background: var(--bg); border-radius: 14px; padding: 14px; font-size: 14px; color: var(--muted); }
.steps li b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
.steps li.cand { border: 1.5px dashed var(--cand-line); background: var(--cand-bg); }
.steps li.mine { border-left: 4px solid var(--mine); }

.btn { font: inherit; font-weight: 700; font-size: 16px; min-height: 48px; padding: 0 22px; border-radius: 14px; cursor: pointer;
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); display: inline-flex; align-items: center;
  justify-content: center; gap: 6px; text-decoration: none; white-space: nowrap; transition: background .12s, transform .06s; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.how { color: var(--meta); font-size: 13px; margin: 10px 0 0; }

.foot { color: var(--meta); font-size: 12px; padding: 8px 0 40px; }

@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .paper { padding: 26px 22px; border-radius: 18px; }
  h1 { font-size: 26px; }
  .steps { grid-template-columns: 1fr; }
  .btn.primary { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <!--out--><div class="bands"><div class="band" role="status">로그아웃했어요. 다시 로그인하면 계정을 고를 수 있어요.</div></div><!--/out-->
  <main class="paper">
    <h1>내 노트</h1>
    <p class="lead">겪은 일을 기록하고, AI 가 뽑은 문장을 원문과 대조해 내 판단으로 남겨요.</p>
    <ol class="steps"><li><b>기록</b>겪은 일을 내 말로 적어요.</li>
    <li class="cand"><b>후보</b>기록에서 판단이 될 만한 문장을 뽑아요. 아직 내 판단은 아니에요.</li>
    <li class="mine"><b>내 판단</b>원문과 대조해 내가 남긴 문장만 쌓여요.</li></ol>
    <a class="btn primary" href="/login">로그인</a>
    <p class="how">Google 또는 이메일 코드로 로그인해요. 처음이면 계정이 만들어져요.</p>
  </main>
  <p class="foot">기록·질문·후보는 연결한 AI 대화(ChatGPT·Claude)에서 남겨요. 이 화면은 보기와 결정만 해요.</p>
</div>
</body>
</html>

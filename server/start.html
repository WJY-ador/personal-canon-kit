<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 노트</title>
<style>
/* 시작 화면 — app.html 과 같은 보드 토큰·글꼴. 한 열. */
:root {
  color-scheme: light;
  --paper: #F7F8F6; --card: #FFFFFF; --ink: #1F2937; --muted: #6B7280; --soft: #9CA3AF; --line: #E3E5E1;
  --accent: #186A4B; --on-accent: #FFFFFF; --accent-soft: #EAF3EE;
  --cand-bg: #FBFBFD; --cand-line: #D9D6EE;
  --mine: #186A4B; --mine-bg: #EAF3EE;
  --serif: Georgia, "Noto Serif KR", "Apple SD Gothic Neo", serif;
  --mono: ui-monospace, Menlo, "Apple SD Gothic Neo", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #15181A; --card: #1E2224; --ink: #E7EAE6; --muted: #A3AAA6; --soft: #6F7773; --line: #2E3335;
    --accent: #4FB08A; --on-accent: #0F1412; --accent-soft: #1C2E26;
    --cand-bg: #202029; --cand-line: #3B3850;
    --mine: #4FB08A; --mine-bg: #1C2E26;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #15181A; --card: #1E2224; --ink: #E7EAE6; --muted: #A3AAA6; --soft: #6F7773; --line: #2E3335;
  --accent: #4FB08A; --on-accent: #0F1412; --accent-soft: #1C2E26;
  --cand-bg: #202029; --cand-line: #3B3850;
  --mine: #4FB08A; --mine-bg: #1C2E26;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); overflow-wrap: anywhere; word-break: keep-all;
  font: 14px/1.55 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 1.4rem; }

.bands { padding-top: 2.4rem; }
.band { padding: .6rem .9rem; border-radius: 8px; margin-bottom: .6rem; font-size: .82rem; background: var(--card); border: 1px solid var(--line); }

.paper { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.8rem 2rem; margin: 2.4rem 0 1rem; }
.bands + .paper { margin-top: .2rem; }
h1 { font-family: var(--serif); font-size: 1.65rem; line-height: 1.3; margin: 0 0 .4rem; letter-spacing: -.01em; font-weight: 500; }
.lead { color: var(--muted); margin: 0 0 1.2rem; }

.steps { list-style: none; padding: 0; margin: 0 0 1.3rem; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.steps li { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: .7rem; font-size: .8rem; color: var(--muted); }
.steps li b { display: block; color: var(--ink); font-size: .86rem; margin-bottom: 2px; }
.steps li.cand { border: 1px dashed var(--cand-line); background: var(--cand-bg); }
.steps li.mine { border-left: 3px solid var(--mine); }

.btn { font: inherit; font-weight: 600; font-size: .9rem; min-height: 40px; padding: .4rem 1.2rem; border-radius: 6px; cursor: pointer;
  background: var(--card); color: var(--ink); border: 1px solid var(--line); display: inline-flex; align-items: center;
  justify-content: center; gap: .35rem; text-decoration: none; white-space: nowrap; transition: background .12s; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.how { color: var(--soft); font-size: .76rem; margin: .6rem 0 0; }

.foot { color: var(--soft); font-size: .72rem; padding: .4rem 0 2.4rem; }

@media (max-width: 640px) {
  .wrap { padding: 0 1rem; }
  .paper { padding: 1.2rem 1.1rem; }
  h1 { font-size: 1.35rem; }
  .steps { grid-template-columns: 1fr; }
  .btn.primary { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <!--out--><div class="bands"><div class="band" role="status">로그아웃했어요. 다시 로그인하면 계정을 고를 수 있어요.</div></div><!--/out-->
  <main class="paper">
    <h1>내 노트</h1>
    <p class="lead">겪은 일을 기록하고, AI 가 뽑은 문장을 원문과 대조해 내 판단으로 남겨요.</p>
    <ol class="steps"><li><b>기록</b>겪은 일을 내 말로 적어요.</li>
    <li class="cand"><b>후보</b>기록에서 판단이 될 만한 문장을 뽑아요. 아직 내 판단은 아니에요.</li>
    <li class="mine"><b>내 판단</b>원문과 대조해 내가 남긴 문장만 쌓여요.</li></ol>
    <a class="btn primary" href="/login">로그인</a>
    <p class="how">Google 또는 이메일 코드로 로그인해요. 처음이면 계정이 만들어져요.</p>
  </main>
  <p class="foot">기록·질문·후보는 연결한 AI 대화(ChatGPT·Claude)에서 남겨요. 이 화면은 보기와 결정만 해요.</p>
</div>
</body>
</html>

}
function recRow(id, on) {
  const r = recById(id);
  const dp = dayParts(r ? r.created : "");
  const title = !r ? "찾을 수 없는 기록" : r.broken ? "읽지 못한 기록" : r.title;
  return `<li><a data-rec="${esc(id)}" tabindex="0" role="button" class="${on ? "on" : ""}"><div class="d">${esc(dp.d)}<small>${dp.mo ? dp.mo + "월" : ""}</small></div>
    <div><div class="t">${esc(title)}</div><div class="s">${esc(r && r.excerpt ? r.excerpt : "")}</div></div></a></li>`;
}

function sheetSections(tab, q) {
  if (!ok("candidates")) return `<section class="sec">${partFail(S.read.candidates.error, "문장 목록")}</section>`;
  const cs = (S.candidates || []).filter(c => c.question_id === q.id);
  const mine = cs.filter(c => c.status === "confirmed"), wait = cs.filter(c => c.status === "pending"),
        off = cs.filter(c => c.status === "excluded");
  let h = `<section class="sec"><h3>내 판단<span class="count">${mine.length}</span></h3>
    ${mine.length ? `<div class="cards">${mine.map(c => `<div class="card mine"><p class="sent">${esc(c.text)}</p>
      <div class="labels">${decision(c)}${origin(c)}</div>${evLine(c)}</div>`).join("")}</div>`
      : `<div class="empty">아직 내 판단이 없어요. 아래 문장을 원문과 대조해 남기면 여기에 쌓여요.</div>`}</section>`;
  h += `<section class="sec"><h3>아직 안 정한 문장<span class="count">${wait.length}</span></h3>
    ${wait.length ? `<div class="cards">${wait.map(c => `<div class="card cand"><p class="sent">${esc(c.text)}</p>
      <div class="labels">${origin(c)}${decision(c)}</div></div>`).join("")}</div>
      <div class="cta"><p class="hint">남기기 전까진 내 판단이 아니에요.</p><a class="btn primary" href="#${esc(tab.id)}/review/${esc(q.id)}/${esc(wait[0].id)}">원문과 대조하기 · ${wait.length}개</a></div>`
      : `<div class="empty">${cs.length ? "정할 문장이 남아 있지 않아요." : "아직 이 질문에 뽑힌 문장이 없어요. 기록에서 후보를 뽑으면 여기에 떠요."}</div>`}</section>`;
  if (off.length) h += `<details class="fold"><summary>남기지 않은 문장 보기 · ${off.length}개</summary><div class="cards">${off.map(c =>
      `<div class="card cand"><p class="sent">${esc(c.text)}</p><div class="labels">${origin(c)}${decision(c)}</div>${evLine(c)}</div>`).join("")}</div></details>`;
  const recs = [...new Set(cs.map(c => c.record_id))];
  if (recs.length) h += `<section class="sec"><h3>연결된 기록<span class="count">${recs.length}</span></h3>
    <ul class="recs">${recs.map(r => recRow(r, false)).join("")}</ul></section>`;
  return h;
}

function recentRecords() {
  if (!ok("journal")) return `<section class="sec">${partFail(S.read.journal.error, "기록 목록")}</section>`;
  const js = (S.journal || []).slice(0, 8);
  return `<section class="sec"><h3>최근 기록<span class="count">${(S.journal || []).length}</span></h3>
    ${js.length ? `<ul class="recs">${js.map(j => recRow(j.id, false)).join("")}</ul>` : `<div class="empty">아직 기록이 없어요.</div>`}</section>`;
}

function runStatus() { return ""; }

// ── 기록형 탭 — 왼: 고른 기록 원문 + 이 기록에서 나온 문장 / 오른: 다른 기록(sticky) ──
function renderRecordTab(tab, sel) {
  const bl = new Set(tab.blocks);
  const js = ok("journal") ? (S.journal || []) : [];
  const j = js.find(x => x.id === sel) || js[0];
  let body, side = "";
  if (!ok("journal")) body = partFail(S.read.journal.error, "기록 목록");
  else if (!j) body = firstRun(tab, bl);
  else {
    const cs = (S.candidates || []).filter(c => c.record_id === j.id);
    const q = qById(j.question_id);
    body = `<div class="eyebrow">기록${q ? ` · ${esc(q.text)}` : ""}</div><h2 class="title">${esc(j.broken ? "읽지 못한 기록" : j.title)}</h2>
      ${bl.has("next") ? nextLine(tab, "") : ""}
      <div id="recbody"><div class="doc"><p class="dim">원문을 불러오는 중이에요…</p></div></div>
      ${(bl.has("candidates") || bl.has("sheet")) && cs.length ? `<section class="sec"><h3>이 기록에서 나온 문장<span class="count">${cs.length}</span></h3>
        <div class="cards">${cs.map(c => `<div class="card ${c.status === "confirmed" ? "mine" : "cand"}"><p class="sent">${esc(c.text)}</p>
        <div class="labels">${decision(c)}${origin(c)}</div></div>`).join("")}</div></section>` : ""}
      ${bl.has("status") ? runStatus() : ""}`;
    if (js.length > 1) side = `<h2 class="sh">다른 기록 <span class="speclabel">${js.length - 1}</span></h2>
      <div class="recbox"><ul class="recs">${js.filter(x => x.id !== j.id).slice(0, 12).map(x => `<li><a href="#${esc(tab.id)}/${esc(x.id)}">
        <div class="d">${esc(dayParts(x.created).d)}<small>${dayParts(x.created).mo ? dayParts(x.created).mo + "월" : ""}</small></div>
        <div><div class="t">${esc(x.broken ? "읽지 못한 기록" : x.title)}</div><div class="s">${esc(x.excerpt || "")}</div></div></a></li>`).join("")}</ul></div>`;
  }
  $("view").innerHTML = side ? `<div class="board"><div class="paper">${body}</div><aside class="rside" aria-label="다른 기록">${side}</aside></div>`
                             : `<div class="paper sheet">${body}</div>`;
  if (j) fetchRec(j.id).then(r => {
    const box = $("recbody");
    if (!box) return;
    box.innerHTML = r.ok ? `<div class="recmeta">${esc(mdhm(r.meta.created))} · ${esc(srcLabel(r.meta.source))}</div><div class="doc">${docHtml(r, "").html}</div>`
                         : partFail({code: r.code, msg: r.msg}, "이 기록");
  });
}

// ── 원문 그리기 ───────────────────────────────────────
function fetchRec(id) {
  if (!recCache[id]) recCache[id] = fetch("/api/journal?id=" + encodeURIComponent(id), {cache: "no-store"})
    .then(async r => Object.assign({ok: r.ok}, await r.json()))
    .catch(() => ({ok: false, code: "OFFLINE", msg: "서버에 연결하지 못했어요"}));
  return recCache[id];
}
function srcLabel(s) {
  if (!s) return "출처 없음";
  if (s.startsWith("파일:")) return "파일에서 가져옴";
  return s;
}
// 본문을 빈 줄 기준 문단으로 나눈다. 제목(# …)은 화면 제목과 겹쳐 뺀다.
// 「이게 어디에 붙나」 절은 키트가 붙이는 양식이라 따로 그리고, 질문 ID 는 질문 문장으로 바꿔 보인다.
function splitDoc(body, title) {
  const parts = String(body || "").split(/\n\s*\n/).map(s => s.replace(/^\n+|\s+$/g, "")).filter(Boolean);
  const out = [], attach = [];
  let inAttach = false;
  for (const p of parts) {
    if (/^##\s*이게 어디에 붙나/.test(p)) { inAttach = true; continue; }
    if (inAttach) { attach.push(p); continue; }
    if (/^#\s/.test(p) && p.replace(/^#\s+/, "").trim() === String(title || "").trim()) continue;
    out.push(p);
  }
  return {paras: out, attach: attach.join("\n")};
}
function paraHtml(p, quote) {
  const isH = /^#{1,6}\s/.test(p);
  const text = isH ? p.replace(/^#{1,6}\s+/, "") : p;
  let inner = esc(text);
  if (quote && text.includes(quote)) { const i = text.indexOf(quote);
    inner = esc(text.slice(0, i)) + `<mark>${esc(quote)}</mark>` + esc(text.slice(i + quote.length)); }
  return `<p class="${isH ? "h" : ""}">${inner}</p>`;
}
function attachHtml(raw) {
  const KEYS = {"질문": "질문", "판단": "판단 메모", "다음": "다음", "출처": "출처"};
  const rows = [];
  for (const line of raw.split("\n")) {
    const m = /^\s*-\s*([^:：]+)\s*[:：]\s*(.*)$/.exec(line);
    if (!m || !m[2].trim()) continue;
    let v = m[2].trim();
    if (m[1].trim() === "질문") { const q = qById(v); v = q ? `「${q.text}」` : "연결된 질문을 찾을 수 없음"; }
    rows.push(`<dt>${esc(KEYS[m[1].trim()] || m[1].trim())}</dt><dd>${esc(v)}</dd>`);
  }
  if (!rows.length) return "";
  return `<div class="attach"><h4>이 기록이 붙는 곳</h4><dl>${rows.join("")}</dl></div>`;
}
function docHtml(r, quote) {
  const d = splitDoc(r.body, r.title);
  return {html: d.paras.map(p => paraHtml(p, quote)).join("") + attachHtml(d.attach), split: d};
}

// 오늘 탭의 읽기 판(#reader)이 보이면(≥900px) 거기에, 아니면 대화상자에 원문을 연다.
let readerAt = null;   // {id, quote} — 오늘 탭을 다시 그려도 읽던 원문을 유지한다
async function showReader(id, quote) {
  const rd = $("reader");
  const at = readerAt = {id, quote: quote || ""};
  document.querySelectorAll(".recs a[data-rec]").forEach(a => a.classList.toggle("on", a.dataset.rec === id));
  rd.innerHTML = `<p class="empty">원문을 불러오는 중이에요…</p>`;
  const r = await fetchRec(id);
  if ($("reader") !== rd || readerAt !== at) return;   // 그사이 다른 원문을 골랐거나 화면이 바뀌었다
  if (!r.ok) { rd.innerHTML = partFail({code: r.code, msg: r.msg}, "이 기록"); return; }
  rd.innerHTML = `<div class="rh"><b>${esc(r.title)}</b><span class="recmeta" style="margin:0">${esc(mdhm(r.meta.created))} · ${esc(srcLabel(r.meta.source))}</span></div>
    <div class="doc">${docHtml(r, at.quote).html}</div>`;
}
async function openRec(id, quote) {
  const rd = $("reader");
  if (rd && rd.offsetParent !== null) return showReader(id, quote);
  $("dlg-title").textContent = recLabel(id).split(" · ")[0];
  $("dlg-meta").textContent = "";
  $("dlg-body").innerHTML = `<p style="color:var(--muted)">원문을 불러오는 중이에요…</p>`;
  $("dlg").showModal();
  const r = await fetchRec(id);
  if (!r.ok) { $("dlg-body").innerHTML = partFail({code: r.code, msg: r.msg}, "이 기록"); return; }
  $("dlg-title").textContent = r.title;
  $("dlg-meta").textContent = `${mdhm(r.meta.created)} · ${srcLabel(r.meta.source)}`;
  $("dlg-body").innerHTML = `<div class="doc">${docHtml(r, quote || "").html}</div>`;
}

// ── 원문과 대조하기 (한 장씩, 여기서 결정을 저장한다. ≥1000px 은 오른쪽에 근거 원문 sticky) ─────
// 「…으로/로 돌아가기」 — 받침 없거나 ㄹ 받침이면 「로」
function roJosa(w) { const c = String(w).slice(-1).charCodeAt(0) - 0xAC00; return c < 0 || c > 11171 || c % 28 === 0 || c % 28 === 8 ? "로" : "으로"; }
// 라우트 #탭/review/질문ID/후보ID. 「목록 끝」은 후보ID 자리에 end. 옛 숫자 idx 는 그 자리의 후보 ID 로 바꿔 끼운다.
const SAVED = {confirm: "내 판단으로 남겼어요.", edit_confirm: "고친 문장을 내 판단으로 남겼어요.", exclude: "남기지 않음으로 저장했어요."};
let lastSave = "";      // 저장 성공 문구 — 다음에 그리는 대조 화면의 #save-status 에 한 번만 찍는다
let afterSave = null;   // {qid, nextId} — 저장 직전 목록에서 현재 다음 후보

function renderReview(tab, qid, key) {
  const byRec = qid.startsWith("r:");
  const q = byRec ? null : qById(qid);
  const rec = byRec ? recById(qid.slice(2)) : null;
  const qText = byRec ? `${LABELS.noQuestion} · ${LABELS.record} 「${rec ? rec.title : "찾을 수 없는 기록"}」` : q ? q.text : "찾을 수 없는 질문";
  // 돌아가기는 들어온 탭으로. 질문형 탭은 그 질문 한 장, 그 외 탭은 그 탭에서 마지막으로 본 화면.
  const qKind = tab.view === "question" && !byRec;
  const back = qKind ? `#${tab.id}/${qid}` : (lastView[tab.id] || `#${tab.id}`);
  const backText = qKind ? "질문으로 돌아가기" : `${tab.label}${roJosa(tab.label)} 돌아가기`;
  const base = `#${tab.id}/review/${qid}/`;
  const go = id => location.replace(base + id);
  const head = (m, link) => `<div class="rvhead"><h2 id="review-title" tabindex="-1">원문과 대조하기</h2>${m ? `<p class="pos">아직 안 정한 문장 ${m}개</p>` : ""}${link ? `<a class="link" href="${esc(back)}">${esc(backText)}</a>` : ""}</div>`;
  const status = `<p id="save-status" role="status" aria-atomic="true"></p>`;
  const show = html => {
    $("view").innerHTML = html;
    if (!lastSave) return;
    if ($("save-status")) $("save-status").textContent = lastSave;
    lastSave = "";
    $("review-title").focus();
  };
  if (!ok("candidates")) { show(`${head(0, true)}<div class="paper">${partFail(S.read.candidates.error, "문장 목록")}</div>`); return; }
  const wait = byRec ? noQPending().filter(c => c.record_id === qid.slice(2)) : pendingOf(qid);
  if (!key.startsWith("c_") && key !== "end") {   // 옛 숫자 idx(또는 빈 자리)
    const t = wait[parseInt(key || "0", 10) || 0];
    if (t) { go(t.id); return; }
    if (wait.length) { go("end"); return; }
  }
  const idx = wait.findIndex(x => x.id === key);
  const nav = afterSave && afterSave.qid === qid ? afterSave : null;
  afterSave = null;
  if (key.startsWith("c_") && idx < 0) {   // 이미 정한(또는 없는) 후보 — 저장 직후면 기억해 둔 다음 후보, 아니면 남은 첫 후보로
    const t = (nav && wait.find(x => x.id === nav.nextId)) || wait[0];
    if (t) { go(t.id); return; }
  }
  if (!wait.length) {
    show(`${head(0, false)}<div class="paper done"><b>아직 안 정한 문장이 없어요.</b><p>새 기록에서 후보를 뽑으면 여기에 떠요.</p>
      <div class="row"><a class="btn primary" href="${esc(back)}">${esc(backText)}</a></div>${status}</div>`);
    return;
  }
  if (idx < 0) {   // end — 건너뛰기로 목록 끝에 닿았다
    show(`${head(0, false)}<div class="paper done"><b>목록 끝이에요. 아직 안 정한 문장 ${wait.length}개가 남아 있어요.</b>
      <div class="row"><a class="btn primary" href="${esc(base + wait[0].id)}">남은 문장 보기</a><a class="btn" href="${esc(back)}">${esc(backText)}</a></div>${status}</div>`);
    return;
  }
  const c = wait[idx];
  const cur = {qid, c, nextId: wait[idx + 1] ? wait[idx + 1].id : ""};
  show(`<div class="review">${head(wait.length, true)}
    <section class="rvcard" data-candidate-id="${esc(c.id)}" aria-labelledby="candidate-title">
      <p class="rvq">${byRec ? "" : "질문 · "}${esc(qText)}</p><h3 id="candidate-title" class="sr">판단 후보</h3><p class="sent">${esc(c.text)}</p>
      <div class="labels">${decision(c)}${origin(c)}${aiWordingChip(c)}</div></section>
    <section class="rvsrc" id="rvsrc" aria-labelledby="source-title"><div class="srchead"><h3 id="source-title">근거 원문</h3></div>
      <div class="doc"><p class="dim">원문을 불러오는 중이에요…</p></div></section>
    <section class="rvact" aria-labelledby="decision-title" aria-busy="false">
      <h3 id="decision-title">남길지 정하기</h3>
      <p id="decision-help" class="dest">${byRec ? `남기면 ${LABELS.mine}에 들어가요(${LABELS.noQuestion}).` : `남기면 「${esc(qText)}」의 내 판단에 들어가요.`} 남기지 않아도 후보와 원문은 삭제되지 않아요. 원문은 바뀌지 않아요.</p>
      <div class="acts" id="rvacts" role="group" aria-label="후보 결정" aria-describedby="decision-help">
        <button class="secondary" type="button" data-act="confirm" disabled>내 판단으로 남기기</button>
        <button class="secondary" type="button" data-act="edit" aria-expanded="false" aria-controls="rvedit" disabled>고쳐서 남기기</button>
        <button class="secondary" type="button" data-act="exclude" disabled>남기지 않기</button></div>
      <form id="rvedit" hidden aria-describedby="edit-help">
        <label for="rvtext">내 판단으로 남길 문장</label><p id="edit-help" class="hint">후보 문장을 고쳐요. 원문은 바뀌지 않아요.</p>
        <textarea id="rvtext" name="text" rows="3" required>${esc(c.text)}</textarea>
        <div class="acts"><button class="primary" type="submit" data-act="edit_confirm">고친 문장으로 남기기</button><button class="tertiary" type="button" data-act="edit-cancel">취소</button></div></form>
      ${status}<p id="save-error" role="alert" aria-atomic="true" class="blocked"></p></section>
    <nav class="rvnav" aria-label="후보 이동" aria-describedby="skip-help">
      <button class="tertiary" type="button" data-nav="previous"${idx === 0 ? " disabled" : ""}>이전 문장</button><button class="tertiary" type="button" data-nav="skip">건너뛰기</button>
      <p id="skip-help" class="hint">건너뛰어도 아직 안 정한 문장으로 남아요.</p></nav></div>`);
  $("rvacts").onclick = e => {
    const b = e.target.closest("button[data-act]"); if (!b || b.disabled) return;
    if (b.dataset.act === "edit") {
      const f = $("rvedit"), open = f.hidden;
      f.hidden = !open; b.setAttribute("aria-expanded", String(open));
      if (open) $("rvtext").focus();
      return;
    }
    decide(cur, b.dataset.act);
  };
  $("rvedit").onsubmit = e => { e.preventDefault(); decide(cur, "edit_confirm", $("rvtext").value); };
  $("rvedit").onclick = e => {
    if (!e.target.closest('[data-act="edit-cancel"]')) return;
    $("rvedit").hidden = true;
    $("rvtext").value = c.text;
    const eb = document.querySelector('#rvacts [data-act="edit"]');
    eb.setAttribute("aria-expanded", "false"); eb.focus();
  };
  document.querySelector(".rvnav").onclick = e => {
    const b = e.target.closest("button[data-nav]"); if (!b || b.disabled) return;
    if (b.dataset.nav === "previous" && idx > 0) location.hash = base + wait[idx - 1].id;
    if (b.dataset.nav === "skip") location.hash = base + (cur.nextId || "end");
  };
  fetchRec(c.record_id).then(r => {
    const card = document.querySelector(".rvcard");
    if (!card || card.dataset.candidateId !== c.id || !$("rvsrc")) return;   // 그사이 다른 화면으로 옮겼으면 그리지 않는다
    if (!r.ok) {
      $("rvsrc").innerHTML = `<div class="srchead"><h3 id="source-title">근거 원문</h3></div><div class="srcwarn"><b>원문을 불러오지 못했어요. 근거를 확인할 수 없어 남길 수 없어요.</b>
        ${esc(FIXHINT)}${techInfo({code: r.code, msg: r.msg})}</div>`;
      return;
    }
    const quote = c.quote;
    const meta = `<div class="srchead"><h3 id="source-title">근거 원문 · ${esc(r.title)}</h3><span class="recmeta" style="margin:0">${esc(md(r.meta.created))}</span></div>`;
    const d = splitDoc(r.body, r.title);
    const full = docHtml(r, quote).html;
    const tech = `<details class="tech"><summary>기술 정보</summary>만든 시각 ${esc(mdhm(r.meta.created))} · 출처 ${esc(srcLabel(r.meta.source))} · 근거 구절 ${quote.length}자</details>`;
    if (!String(r.body).includes(quote)) {
      $("rvsrc").innerHTML = meta + `<div class="srcwarn"><b>후보의 근거 구절이 저장된 원문과 일치하지 않아 남길 수 없어요.</b>
        찾던 구절: <q>${esc(quote)}</q></div><div class="doc">${full}</div>${tech}`;
      return;
    }
    const at = d.paras.findIndex(p => p.includes(quote));
    let body;
    if (at < 0) {
      body = `<div class="srcnote">근거 구절이 문단 경계에 걸쳐 있어 위치를 강조하지 못했어요. 전체 원문에서 확인해 주세요.</div><div class="doc">${full}</div>`;
    } else {
      const lo = Math.max(0, at - 1), hi = Math.min(d.paras.length - 1, at + 1);
      body = `<div class="doc">${d.paras.slice(lo, hi + 1).map((p, i) => lo + i === at ? paraHtml(p, quote) : paraHtml(p, "").replace('<p class="', '<p class="dim ')).join("")}</div>
        <details class="fold" style="margin-top:12px"><summary>전체 원문 보기</summary><div class="doc">${full}</div></details>`;
    }
    $("rvsrc").innerHTML = meta + body + tech;
    if (document.querySelector(".rvact").getAttribute("aria-busy") !== "true")
      document.querySelectorAll("#rvacts button[data-act]").forEach(b => b.disabled = false);
  });
}

// 저장 중엔 결정·편집·이동을 잠근다. 풀 때는 잠그기 전 상태(근거 확인 전 disabled, 첫 후보의 「이전 문장」)로 되돌린다.
function lockReview(on) {
  const act = document.querySelector(".rvact");
  if (act) act.setAttribute("aria-busy", on ? "true" : "false");
  document.querySelectorAll("#rvacts button, #rvedit button, .rvnav button").forEach(b => {
    if (on) { b.dataset.was = b.disabled ? "1" : ""; b.disabled = true; }
    else if ("was" in b.dataset) { b.disabled = b.dataset.was === "1"; delete b.dataset.was; }
  });
}

// 결정 저장: 호출 하나(confirm / exclude / edit_confirm). 성공하면 상태를 다시 불러와 다음 후보로 간다.
async function decide(cur, action, text) {
  const st = $("save-status"), er = $("save-error");
  er.textContent = "";
  st.textContent = "저장하고 있어요…";
  lockReview(true);
  const saved = async next => {
    lastSave = SAVED[action];
    afterSave = {qid: cur.qid, nextId: cur.nextId};
    for (const k in recCache) delete recCache[k];
    if (next) { applyState(next); return; }
    if (!(await load())) { st.textContent = lastSave; lastSave = ""; afterSave = null; }   // 저장은 됐고 화면만 못 바꿨다 — 띠가 새로 고침을 안내한다
  };
  const body = {candidate_id: cur.c.id, action};
  if (Number.isInteger(cur.c.revision)) body.expected_revision = cur.c.revision;   // 구버전 서버(revision 없음)면 키를 생략 — 검사 없이 저장
  if (action === "edit_confirm") body.text = text;
  let r;
  try {
    r = await fetch("/api/candidate/decide", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body),
      signal: typeof AbortSignal.timeout === "function" ? AbortSignal.timeout(15000) : undefined});
  } catch (e) {
    // 응답을 받지 못했다 — 상태를 다시 읽어 이 후보의 결정이 바뀌었는지 본다
    st.textContent = "저장 결과를 확인하고 있어요…";
    let next;
    try { next = await fetchState(); if (next === null) return; } catch (e2) { next = undefined; }
    const now = next && (next.candidates || []).find(x => x.id === cur.c.id);
    if (now && now.status !== cur.c.status) { await saved(next); return; }
    st.textContent = "";
    er.textContent = "저장 여부를 확인하지 못했어요. 새로 고침해 확인해 주세요.";
    lockReview(false);
    return;
  }
  if (r.status === 401) { location.href = "/"; return; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok && j.code === "CONFLICT") {
    // 다른 곳에서 먼저 바뀌었다 — 서버 문구를 저장 상태 띠에 남기고 상태를 다시 받아 그린다
    lastSave = j.msg || CONFLICT_TEXT;
    if (action === "edit_confirm" && text !== cur.c.text) lastSave += ` 고치던 문장은 저장되지 않았어요: 「${text}」`;
    afterSave = {qid: cur.qid, nextId: cur.nextId};
    if (!(await load())) { st.textContent = lastSave; lastSave = ""; afterSave = null; lockReview(false); }
    return;
  }
  if (!r.ok) {
    st.textContent = "";
    er.textContent = j.msg || "저장하지 못했어요. 다시 시도해 주세요.";
    lockReview(false);
    return;
  }
  await saved(null);
}

// ── 이벤트 ───────────────────────────────────────────
document.addEventListener("click", e => {
  const a = e.target.closest("[data-rec]");
  if (a) { e.preventDefault(); openRec(a.dataset.rec, a.dataset.quote || ""); return; }
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); location.hash = g.dataset.go; return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const done = () => { const t = cp.textContent; cp.textContent = "요청을 복사했어요."; setTimeout(() => cp.textContent = t, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(cp.dataset.copy).then(done, () => {});
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-rec], [data-go]")) { e.preventDefault(); e.target.click(); }
});
$("dlg-close").onclick = () => $("dlg").close();
window.addEventListener("hashchange", () => { if (S) { render(); window.scrollTo(0, 0); } });
$("reload").onclick = () => { for (const k in recCache) delete recCache[k]; load(); deskLoad(); };
$("logout").onclick = async () => {
  let to = "/?out=1";
  try { const j = await (await fetch("/logout", {method: "POST"})).json(); if (j && j.ok && j.redirect) to = j.redirect; } catch (e) {}
  location.href = to;
};
// ── 계정 메뉴 (P5) — 문의 열기 · 이름 공유 · 문의 섹션 숨김 · 로그아웃(위 핸들러) ──
let deskPeek = false;   // 숨긴 문의 섹션을 메뉴에서 이번 화면에만 연 상태(저장값은 그대로)
function acctApply() {
  const u = S && S.user || {}, names = u.struct_names === true, hidden = u.desk_hidden === true;
  $("acct-names").setAttribute("aria-pressed", names ? "true" : "false");
  $("acct-names-st").textContent = names ? "켜짐" : "꺼짐";
  $("acct-desk").textContent = hidden ? "문의 섹션 보이기" : "문의 섹션 숨기기";
  $("desk").hidden = hidden && !deskPeek;
}
function acctClose() { $("acct").open = false; }
function deskOpen(where) {
  deskPeek = true;
  $("desk").hidden = false;
  const target = where === "mine" ? $("desk-list-title") : $("desk-form");
  target.scrollIntoView({block: "start"});
  if (where !== "mine") $("desk-text").focus({preventScroll: true});
}
async function acctPost(url, body) {
  $("acct-msg").textContent = "";
  let r, j;
  try {
    r = await fetch(url, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)});
    j = await r.json();
  } catch (e) { r = null; }
  if (r && r.status === 401) { location.href = "/"; return false; }
  if (!r || !r.ok) { $("acct-msg").textContent = (j && j.msg) || "저장하지 못했어요. 새로 고침한 뒤 다시 해 보세요."; return false; }
  return true;
}
$("acct-menu").addEventListener("click", async e => {
  const b = e.target.closest("button[data-acct]");
  if (!b || !S) return;
  const act = b.dataset.acct;
  if (act === "logout") return;   // 로그아웃은 $("logout").onclick
  if (act === "send" || act === "mine" || act === "privacy") {
    if (act === "privacy") document.querySelector('#desk-form input[name="kind"][value="privacy"]').checked = true;
    acctClose();
    deskOpen(act);
    return;
  }
  b.disabled = true;
  try {
    if (act === "names") {
      if (await acctPost("/api/optional-consent", {kind: "struct_names", on: S.user.struct_names !== true})) await load();
    } else if (act === "desk") {
      const hidden = S.user.desk_hidden !== true;
      if (await acctPost("/api/desk-visibility", {hidden})) { S.user.desk_hidden = hidden; deskPeek = false; acctApply(); acctClose(); }
    }
  } finally { b.disabled = false; }
});
document.addEventListener("click", e => { if ($("acct").open && !$("acct").contains(e.target)) acctClose(); });
$("acct").addEventListener("keydown", e => {
  if (e.key === "Escape" && $("acct").open) { acctClose(); $("acct").querySelector("summary").focus(); }
});
// ── /계정 메뉴 ──
// ── 문의 데스크 (desk-0) ──
// 사용자 글은 ${esc(…)} 로만 HTML 에 넣는다 — 이 구간은 시험(test_feedback)이 정적으로 검사한다: 모든 보간은 esc, innerHTML 우변은 템플릿.
const DESK_MAX = 4096;   // 서버 db.LIMIT_TICKET 과 같은 단위(UTF-8 바이트)
const DESK_CHIP = {open: "st-wait", ack: "", doing: "flag", done: "st-mine", wontfix: "st-off"};
const DESK_PAGE = {today: "today", question: "question", record: "record", structure: "structure", map: "map"};
const deskBytes = s => new TextEncoder().encode(s).length;
// 운영자 처리는 /admin/tickets(서버 렌더) — /app 은 관리자여도 「내 문의」만 본다.
function deskPage() {
  if (!S) return "other";
  const R = route();
  if (R.a === "review") return "review";
  return DESK_PAGE[pickTab(R, tabsList()).view] || "other";
}
function deskCount() {
  const n = deskBytes($("desk-text").value), over = n > DESK_MAX;
  $("desk-count").textContent = n + " / " + DESK_MAX + " 바이트" + (over ? " — 너무 길어요" : "");
  $("desk-count").classList.toggle("over", over);
  $("desk-send").disabled = over || !$("desk-text").value.trim();
}
function deskRow(t) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td><button type="button" class="tkopen" data-tk="${esc(t.id)}" aria-haspopup="dialog">${esc(md(t.created))}</button></td><td>${esc(LABELS.ticketKind[t.kind] || t.kind)}</td>
    <td><span class="chip ${esc(DESK_CHIP[t.status] || "")}">${esc(LABELS.ticketStatus[t.status] || t.status)}</span></td><td>${esc(t.has_reply ? "있음" : "—")}</td>
    <td>${esc(md(t.public_updated) || "—")}</td><td>${esc(clip(t.text, 60))}</td>`;
  return tr;
}
// 행 상세 — GET /api/feedback/<id>(본인 것만): 보낸 글 · 공개 답변 · 공개 이력. 내부 메모·내부 이력은 서버가 주지 않는다
function deskHistText(h) {
  if (h.kind === "status") return "상태 " + (LABELS.ticketStatus[h.from_val] || h.from_val || "") + " → " + (LABELS.ticketStatus[h.to_val] || h.to_val || "");
  return "운영자 답변이 바뀌었어요";
}
async function deskShow(id) {
  $("dlg-title").textContent = "내 문의";
  $("dlg-meta").textContent = "";
  $("dlg-body").innerHTML = `<p class="hint">불러오는 중이에요…</p>`;
  if (!$("dlg").open) $("dlg").showModal();
  let r, j = {};
  try { r = await fetch("/api/feedback/" + encodeURIComponent(id), {cache: "no-store"}); j = await r.json(); } catch (e) { r = null; }
  if (r && r.status === 401) { location.href = "/"; return; }
  if (!r || !r.ok) { $("dlg-body").innerHTML = `<p class="blocked">${esc((j && j.msg) || "문의를 불러오지 못했어요. 새로 고침해 주세요.")}</p>`; return; }
  $("dlg-title").textContent = "내 문의 · " + (LABELS.ticketKind[j.kind] || j.kind);
  $("dlg-meta").textContent = mdhm(j.created) + " 접수 · " + (LABELS.ticketStatus[j.status] || j.status);
  $("dlg-body").innerHTML = `<div class="desktk"><h3>보낸 글</h3><p class="desktxt">${esc(j.text)}</p>
    <h3>운영자 답변</h3><p class="desktxt">${esc(j.reply || "아직 답변이 없어요.")}</p><p class="hint">${esc(j.reply_at ? mdhm(j.reply_at) + " 답변" : "")}</p>
    <h3>처리 이력</h3><ul id="desk-hist"></ul><p class="hint" id="desk-hist-empty">${esc((j.history || []).length ? "" : "아직 처리 이력이 없어요.")}</p></div>`;
  for (const h of j.history || []) {
    const li = document.createElement("li");
    li.textContent = mdhm(h.at) + " · " + deskHistText(h);
    $("desk-hist").append(li);
  }
}
async function deskLoad() {
  let r, j;
  try { r = await fetch("/api/feedback", {cache: "no-store"}); j = await r.json(); } catch (e) { r = null; }
  if (r && r.status === 401) return;   // 로그인이 풀렸으면 load() 가 시작 화면으로 보낸다
  if (!r || !r.ok) { $("desk-error").textContent = "내 문의를 불러오지 못했어요. 새로 고침해 주세요."; return; }
  const list = j.tickets || [];
  $("desk-list").replaceChildren(...list.map(deskRow));
  $("desk-empty").hidden = list.length > 0;
}
async function deskSend(e) {
  e.preventDefault();
  const text = $("desk-text").value, kind = (document.querySelector('#desk-form input[name="kind"]:checked') || {}).value || "bug";
  if (!text.trim() || deskBytes(text) > DESK_MAX) return;
  $("desk-error").textContent = "";
  $("desk-status").textContent = "보내고 있어요…";
  $("desk-send").disabled = true;
  let r, j = {};
  try {
    r = await fetch("/api/feedback", {method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify({kind, text, page: deskPage()})});
    j = await r.json().catch(() => ({}));
  } catch (err) { r = null; }
  if (r && r.status === 401) { location.href = "/"; return; }
  if (!r || !r.ok) {
    $("desk-status").textContent = "";
    $("desk-error").textContent = (j && j.msg) || "보내지 못했어요. 잠시 뒤 다시 보내 주세요.";
    deskCount();
    return;
  }
  $("desk-text").value = "";
  deskCount();
  $("desk-status").textContent = "보냈어요. 처리 상태는 「내 문의」에서 볼 수 있어요.";
  deskLoad();
}
$("desk-text").addEventListener("input", deskCount);
$("desk-form").addEventListener("submit", deskSend);
$("desk-list").addEventListener("click", e => { const b = e.target.closest("button[data-tk]"); if (b) deskShow(b.dataset.tk); });
// ── /문의 데스크 ──
load();
deskLoad();
</script>

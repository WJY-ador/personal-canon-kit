<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 대시보드</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
  --accent: #2f5d50; --accent-soft: #e5efe9; --warn: #8a5a00; --warn-soft: #fbf1dc;
  --fail: #9b2c2c; --fail-soft: #fbe7e7; --ai: #5a4a8a; --ai-soft: #eeebf7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f99; --line: #33322f;
    --accent: #8cc4b0; --accent-soft: #23332d; --warn: #e6b65c; --warn-soft: #3a2f1a;
    --fail: #f08a8a; --fail-soft: #3d2222; --ai: #b9a8ec; --ai-soft: #2c2740;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); overflow-wrap: anywhere;
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; }
header { padding: 18px 24px 0; max-width: 1080px; margin: 0 auto; }
header h1 { font-size: 18px; margin: 0 0 4px; }
header .sub { color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 14px; border-bottom: 1px solid var(--line); }
nav a { padding: 8px 14px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; }
nav a.on { color: var(--ink); border-color: var(--accent); font-weight: 600; }
main { max-width: 1080px; margin: 0 auto; padding: 18px 24px 60px; }
.banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
.banner.sample { background: var(--warn-soft); color: var(--warn); }
.banner.err { background: var(--fail-soft); color: var(--fail); }
.next { background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
.next b { color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.block { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.block h2 { font-size: 14px; margin: 0 0 2px; }
.block .desc { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
.block.off { opacity: .65; }
.empty { color: var(--muted); font-size: 14px; }
.empty code, code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; word-break: break-all; }
ul.items { list-style: none; padding: 0; margin: 0; }
ul.items li { padding: 8px 0; border-top: 1px solid var(--line); }
ul.items li:first-child { border-top: 0; }
.tag { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 10px; margin-right: 6px; }
.t-ai { background: var(--ai-soft); color: var(--ai); }
.t-self { background: var(--accent-soft); color: var(--accent); }
.t-ok { background: var(--accent-soft); color: var(--accent); }
.t-warn { background: var(--warn-soft); color: var(--warn); }
.t-fail { background: var(--fail-soft); color: var(--fail); }
.quote { color: var(--muted); font-size: 13px; margin-top: 3px; }
a.rec { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.sheet h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); }
.sheet .title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
.meta { color: var(--muted); font-size: 12px; }
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(760px, 92vw);
  background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog header { display: flex; justify-content: space-between; align-items: start; gap: 10px; padding: 14px 18px;
  border-bottom: 1px solid var(--line); max-width: none; }
dialog pre { white-space: pre-wrap; word-break: break-word; margin: 0; padding: 16px 18px; max-height: 70vh; overflow: auto;
  font: 14px/1.7 inherit; font-family: inherit; }
button { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 10px; cursor: pointer; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
@media (max-width: 560px) { header, main { padding-left: 16px; padding-right: 16px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>내 대시보드</h1>
  <div class="sub">읽기 전용 화면입니다. 새로고침해도 모델을 부르거나 파일을 바꾸지 않습니다. 기록·정리는 <code>canon.py</code> 명령으로 합니다.</div>
  <nav id="nav"></nav>
</header>
<main>
  <div id="banners"></div>
  <div class="toolbar"><span id="stamp"></span><button id="reload">다시 읽기</button></div>
  <div id="view"></div>
</main>
<dialog id="dlg"><header><div><div id="dlg-title" style="font-weight:600"></div><div id="dlg-meta" class="meta"></div></div>
  <button onclick="document.getElementById('dlg').close()">닫기</button></header><pre id="dlg-body"></pre></dialog>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const t16 = s => String(s || "").slice(0, 16).replace("T", " ");
let S = null;

async function load() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    S = await r.json();
  } catch (e) {
    $("view").innerHTML = `<div class="banner err">서버에 연결하지 못했습니다. 터미널에서 <code>python3 canon.py serve</code> 가 켜져 있는지 확인하세요.</div>`;
    return;
  }
  render();
}

function tabsList() {
  const tabs = (S.tabs || []).slice();
  if (!tabs.length) tabs.push({id: "start", label: "시작", blocks: ["next", "journal", "status"], virtual: true});
  return tabs;
}

function render() {
  const tabs = tabsList();
  const cur = location.hash.slice(1);
  const tab = tabs.find(t => t.id === cur) || tabs[0];
  $("nav").innerHTML = tabs.map(t => `<a href="#${esc(t.id)}" class="${t.id === tab.id ? "on" : ""}">${esc(t.label)}</a>`).join("");
  let b = "";
  if (S.meta && S.meta.kind === "sample") b += `<div class="banner sample">지금 보는 것은 <b>가짜 샘플 데이터</b>입니다. 내 자료는 다른 데이터 폴더에 따로 만드세요.</div>`;
  for (const e of S.errors || []) b += `<div class="banner err"><b>[${esc(e.code)}]</b> ${esc(e.msg)}${e.action ? `<br>다음 조치: ${esc(e.action)}` : ""}</div>`;
  if (tab.virtual) b += S.tabs_ok === false
    ? `<div class="banner sample">탭 설정을 읽지 못해 기본 화면을 보여 줍니다. 내 탭은 지워지지 않았습니다 — 위 오류의 조치를 따르세요.</div>`
    : `<div class="banner sample">아직 내 탭이 없습니다. 매일 볼 것을 내 말로 정해 <code>tabs propose</code> 하세요.</div>`;
  $("banners").innerHTML = b;
  $("stamp").textContent = `읽은 시각 ${t16(S.generated)} · v${S.version || ""}`;
  $("view").innerHTML = `<div class="grid">${tab.blocks.map(renderBlock).join("")}</div>`;
}

function blockWrap(id, inner, off) {
  const m = (S.blocks || {})[id] || {name: id, desc: ""};
  return `<section class="block ${off ? "off" : ""}"><h2>${esc(m.name)}</h2><div class="desc">${esc(m.desc)}</div>${inner}</section>`;
}

function recLink(id) { return `<a class="rec" data-rec="${esc(id)}">${esc(id)}</a>`; }

function renderBlock(id) {
  const has = S.has || {};
  switch (id) {
    case "next":
      return blockWrap(id, `<div class="next"><b>다음 행동</b><br>${esc(S.next)}</div>`);
    case "status": {
      const d = (S.runs || {}).digest;
      if (!d) return blockWrap(id, `<div class="empty">아직 정리(digest)를 실행한 적이 없습니다.</div>`);
      const cls = {ok: "t-ok", failed: "t-fail", running: "t-warn"}[d.state] || "";
      const lbl = {ok: "성공", failed: "실패", running: "실행 중(또는 중단됨)"}[d.state] || d.state;
      return blockWrap(id, `<div><span class="tag ${cls}">${esc(lbl)}</span>${esc(d.mode === "model" ? "모델 정리" : "내 메모 정리")} · 기록 ${esc(d.record)}</div>
        <div class="meta">시작 ${esc(t16(d.started) || "-")} · 끝 ${esc(t16(d.finished) || "-")} · 마지막 성공 ${esc(t16(d.last_success) || "없음")}</div>
        ${d.state === "failed" ? `<div class="quote">[${esc(d.error_code)}] ${esc(d.error)}<br>다음 조치: ${esc(d.action || "")}</div>` : ""}`);
    }
    case "questions": {
      if (!has.questions) return blockWrap(id, `<div class="empty">질문이 아직 없습니다. 없어도 됩니다 — 기록 1편부터 시작하세요.</div>`, true);
      return blockWrap(id, `<ul class="items">${S.questions.map(q => `<li><b>${esc(q.id)}</b> ${esc(q.text)}</li>`).join("")}</ul>`);
    }
    case "journal": {
      if (!has.journal) return blockWrap(id, `<div class="empty">기록이 없습니다. 메모 1편으로 시작하세요:<br><code>python3 canon.py record add --title "…" --text "…"</code></div>`, true);
      return blockWrap(id, `<ul class="items">${S.journal.slice(0, 12).map(j =>
        `<li>${recLink(j.id)} ${esc(j.title)}<div class="meta">${esc(t16(j.created))}${j.question ? " · " + esc(j.question) : ""}${j.broken ? " · 읽기 실패" : ""}</div></li>`).join("")}</ul>`);
    }
    case "candidates": {
      const pend = (S.candidates || []).filter(c => c.status === "pending");
      if (!pend.length) return blockWrap(id, `<div class="empty">${has.candidates ? "확인 대기 후보가 없습니다." : "아직 후보가 없습니다. 기록 1편을 정리(digest)하면 여기에 뜹니다."}</div>`, !has.candidates);
      return blockWrap(id, `<ul class="items">${pend.map(c =>
        `<li><span class="tag ${c.origin === "ai" ? "t-ai" : "t-self"}">${c.origin === "ai" ? "AI 제안" : "내 메모"}</span>${esc(c.text)}
         <div class="quote">근거 ${recLink(c.evidence.record)}: “${esc(c.evidence.quote)}”</div>
         <div class="meta">${esc(c.id)} · 확인: <code>python3 canon.py candidate confirm ${esc(c.id)}</code></div></li>`).join("")}</ul>`);
    }
    case "sheet": {
      if (!has.questions) return blockWrap(id, `<div class="empty">질문이 생기면 질문별 한 장이 여기에 뜹니다.</div>`, true);
      return blockWrap(id, S.questions.map(q => renderSheet(q)).join(""));
    }
    default:
      return blockWrap(id, `<div class="banner err">알 수 없는 블록 ${esc(id)} — 이 제품 버전에 없는 블록입니다. <code>python3 canon.py doctor</code></div>`);
  }
}

function renderSheet(q) {
  const si = (S.sheets || {})[q.id] || {};
  const cands = (S.candidates || []).filter(c => c.question === q.id);
  const conf = cands.filter(c => c.status === "confirmed");
  const pend = cands.filter(c => c.status === "pending");
  let state = si.exists ? (si.stale ? `<span class="tag t-warn">오래된 결과</span>` : `<span class="tag t-ok">최신</span>`) : `<span class="tag t-warn">아직 안 만듦</span>`;
  const recs = [...new Set(cands.map(c => c.evidence.record))];
  return `<div class="sheet"><div class="title">${esc(q.text)}</div>
    <div class="meta">${state}${si.built ? " 갱신 " + esc(t16(si.built)) : ""} · ${esc(q.id)}${si.stale ? ` · <code>python3 canon.py sheet build ${esc(q.id)}</code>` : ""}</div>
    <h3>내가 확인한 판단</h3>
    ${conf.length ? `<ul class="items">${conf.map(c => `<li>${esc(c.text)}<div class="quote">근거 ${recLink(c.evidence.record)}: “${esc(c.evidence.quote)}”</div></li>`).join("")}</ul>` : `<div class="empty">아직 없음 — 확인 대기 후보를 확인하면 여기로 옵니다.</div>`}
    <h3>확인 대기 — 아직 내 판단 아님 (${pend.length})</h3>
    ${pend.length ? `<ul class="items">${pend.map(c => `<li><span class="tag ${c.origin === "ai" ? "t-ai" : "t-self"}">${c.origin === "ai" ? "AI 제안" : "내 메모"}</span>${esc(c.text)}</li>`).join("")}</ul>` : `<div class="empty">없음</div>`}
    <h3>연결된 기록</h3>
    ${recs.length ? recs.map(recLink).join(" · ") : `<div class="empty">없음</div>`}</div>`;
}

async function openRec(id) {
  const r = await fetch("/api/journal?id=" + encodeURIComponent(id), {cache: "no-store"});
  const j = await r.json();
  $("dlg-title").textContent = r.ok ? j.title : "원문을 열 수 없습니다";
  $("dlg-meta").textContent = r.ok ? `${j.id} · ${j.meta.created || ""} · 출처 ${j.meta.source || ""}` : `[${j.code}]`;
  $("dlg-body").textContent = r.ok ? j.body : `${j.msg}\n다음 조치: ${j.action || ""}`;
  $("dlg").showModal();
}

document.addEventListener("click", e => { const a = e.target.closest("[data-rec]"); if (a) openRec(a.dataset.rec); });
window.addEventListener("hashchange", () => S && render());
$("reload").onclick = load;
load();
</script>
</body>
</html>

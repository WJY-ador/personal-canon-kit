# 검사 게이트. Render 의 "After CI checks pass" 는 특정 체크 이름이 아니라 커밋의 체크 전체를 본다
# (success·neutral·skipped 면 통과). 잡 이름 `test` 는 그대로 둔다.
# 빈 Postgres 에서 돈다 — 신규 스키마 검증이지 운영 DB 업그레이드 검증은 아니다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm
      CRM_DEV: "1"
      CRM_DEV_USER: tester@example.com
      AUTHKIT_ISSUER: https://fake.authkit.test
      CRM_PUBLIC_URL: http://127.0.0.1:8800
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v5

      # 3.13 고정 — 루트 .python-version 에서 읽는다(Render 도 같은 파일)(매트릭스 없음)
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: server/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install server dependencies
        run: pip install -r server/requirements.txt

      - name: "① Python 문법 (py_compile)"
        run: python -m py_compile server/*.py

      - name: "② JS 문법 (app.html <script>)"
        run: |
          set -eo pipefail
          sed -n '/^<script>$/,/^<\/script>$/p' server/app.html | sed '1d;$d' > "$RUNNER_TEMP/app.js"
          test -s "$RUNNER_TEMP/app.js" || { echo "::error::app.html 에서 <script> 블록을 못 찾음"; exit 1; }
          wc -l "$RUNNER_TEMP/app.js"
          node --check "$RUNNER_TEMP/app.js"

      - name: "운영 DB 보호 가드"
        # 허용 목록: 호스트가 localhost·127.0.0.1 일 때만 통과. 값은 출력하지 않는다.
        run: |
          python - <<'PY'
          import os, sys
          from urllib.parse import urlsplit
          host = urlsplit(os.environ.get("DATABASE_URL", "")).hostname
          if host not in ("localhost", "127.0.0.1"):
              print("::error::DATABASE_URL 호스트가 localhost·127.0.0.1 이 아님 — 시험 중단")
              sys.exit(1)
          print("DATABASE_URL 호스트 = 로컬")
          PY

      - name: "③ 스키마 적용 (init_schema)"
        run: python -c "import sys; sys.path.insert(0, 'server'); import db; db.init_schema(); db.close()"

      - name: "④ 서버 시험 (test_tools.py)"
        run: python server/test_tools.py

      - name: "⑤ crm.py check (참고용)"
        continue-on-error: true
        run: python crm.py check
